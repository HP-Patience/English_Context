      <text x="22" y="37" fill="#f7f4ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">04</text>
      <text x="22" y="70" fill="#fffdfa" font-size="23" font-weight="700">校验发布</text>
      <text x="22" y="96" fill="#f4ddd3" font-size="16">通过后切换 ready</text>
