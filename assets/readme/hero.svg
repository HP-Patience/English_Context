<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">ContextVocab — 语境驱动的考研英语词汇学习</title>
  <desc id="desc">通过连续故事、目标词标记和间隔复习，把考研词汇放进可回想的语境中。</desc>
  <rect width="1200" height="390" rx="28" fill="#f7f4ef"/>
  <path d="M740 0v390M0 326h1200" stroke="#d8d0c7" stroke-width="1"/>
  <path d="M64 54h110" stroke="#c65d3b" stroke-width="4"/>
  <text x="64" y="91" fill="#c65d3b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="4">CONTEXT / VOCAB</text>
  <text x="64" y="166" fill="#262421" font-family="Georgia, Songti SC, serif" font-size="62" font-weight="700">ContextVocab</text>
  <text x="66" y="211" fill="#756f68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25">把考研词汇放进故事里，记住它如何被使用。</text>
  <text x="66" y="263" fill="#262421" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19">6098 词 · 118 分类 · AI 语境 · SM-2 复习</text>
  <g transform="translate(790 48)">
    <text x="0" y="8" fill="#756f68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">ONE LESSON / FOUR MOVES</text>
    <path d="M16 62v214" stroke="#d99a86" stroke-width="3"/>
    <circle cx="16" cy="62" r="10" fill="#c65d3b"/>
    <circle cx="16" cy="133" r="10" fill="#c65d3b"/>
    <circle cx="16" cy="204" r="10" fill="#5898ff"/>
    <circle cx="16" cy="275" r="10" fill="#262421"/>
    <g fill="#262421" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      <text x="48" y="69" font-size="25" font-weight="700">语境识词</text>
      <text x="48" y="94" fill="#756f68" font-size="17">故事段落里遇见目标词</text>
      <text x="48" y="140" font-size="25" font-weight="700">回想释义</text>
      <text x="48" y="165" fill="#756f68" font-size="17">先回忆，再揭示答案</text>
      <text x="48" y="211" font-size="25" font-weight="700">词册复习</text>
      <text x="48" y="236" fill="#756f68" font-size="17">整理音标、词性与用法</text>
      <text x="48" y="282" font-size="25" font-weight="700">到期强化</text>
      <text x="48" y="307" fill="#756f68" font-size="17">按 SM-2 节奏分轮复习</text>
    </g>
  </g>
  <g transform="translate(66 350)" fill="#756f68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <text x="0" y="0">STORY-FIRST LEARNING / PLAIN NEXT STEPS</text>
  </g>
</svg>
